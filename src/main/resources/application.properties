# Server Configuration (Supports Render's dynamic PORT)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=school-management-system

# Database Configuration (Defaults to MySQL for local, overridden by env vars on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Radha_Raman_School?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Priya2311@}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate & JPA Properties (Let Hibernate 6 auto-detect dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Static Resource Handler
spring.web.resources.static-locations=classpath:/static/
